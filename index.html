<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>تحدي كرة قدم - Firebase</title>
  <link rel="stylesheet" href="styles.css"/>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js"></script>
</head>
<body>
  <div class="container">
    <h1>تسجيل الدخول</h1>
    <input type="email" id="email" placeholder="البريد الإلكتروني" />
    <input type="password" id="password" placeholder="كلمة المرور" />
    <button onclick="login()">تسجيل الدخول</button>
    <button onclick="signup()">إنشاء حساب</button>

    <div id="admin-section" style="display: none">
      <h2>إضافة لاعب</h2>
      <input type="text" id="name" placeholder="اسم اللاعب" />
      <input type="number" id="age" placeholder="العمر" />
      <select id="player-nationality"></select>
      <input type="text" id="player_image" placeholder="رابط الصورة" />
      <select id="type">
        <option value="active">لاعب حالي</option>
        <option value="retired">لاعب معتزل</option>
        <option value="coach">مدرب</option>
      </select>
      <div id="club-checkboxes"></div>
      <button onclick="addPlayer()">إضافة</button>

      <h2>بحث عن لاعب</h2>
      <input type="text" id="search-input" placeholder="ابحث عن لاعب" oninput="searchPlayers()" />

      <h2>قائمة اللاعبين</h2>
      <div id="players-list"></div>

      <hr />
      <h2>إدارة الجنسيات</h2>
      <input type="text" id="nat-name" placeholder="اسم الجنسية" />
      <input type="text" id="nat-img" placeholder="رابط صورة العلم" />
      <button onclick="addNationality()">إضافة جنسية</button>
      <div id="nat-list"></div>

      <hr />
      <h2>إدارة الأندية</h2>
      <input type="text" id="club-name" placeholder="اسم النادي" />
      <input type="text" id="club-img" placeholder="رابط صورة النادي" />
      <button onclick="addClub()">إضافة نادي</button>
      <div id="club-list"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
