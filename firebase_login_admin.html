
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>نظام تسجيل دخول</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"></script>
  <style>
    body { font-family: Arial; text-align: center; margin: 50px; background: #f0f0f0; }
    input, button { padding: 10px; margin: 10px; width: 250px; }
    .container { background: white; padding: 20px; border-radius: 10px; display: inline-block; }
  </style>
</head>
<body>

  <div class="container">
    <h2>تسجيل الدخول</h2>
    <input type="text" id="username" placeholder="اسم المستخدم"><br>
    <input type="password" id="password" placeholder="كلمة المرور"><br>
    <button id="loginBtn">تسجيل الدخول</button>

    <div id="admin-section" style="display:none;">
      <h3>إنشاء حساب جديد</h3>
      <input type="text" id="new-username" placeholder="اسم المستخدم الجديد"><br>
      <input type="email" id="new-email" placeholder="البريد الإلكتروني"><br>
      <input type="password" id="new-password" placeholder="كلمة المرور"><br>
      <button id="createBtn">إنشاء الحساب</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBN-3xZDEgNzNCKd4zTDAsaaOWzjx3z9LM",
      authDomain: "fbquiz-582d3.firebaseapp.com",
      projectId: "fbquiz-582d3",
      storageBucket: "fbquiz-582d3.appspot.com",
      messagingSenderId: "939712254423",
      appId: "1:939712254423:web:8efa55b26740eb30597b92"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    document.getElementById("loginBtn").addEventListener("click", async () => {
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      const doc = await db.collection("usernames").doc(username).get();
      if (!doc.exists) return alert("اسم المستخدم غير موجود");

      const email = doc.data().email;
      auth.signInWithEmailAndPassword(email, password)
        .then(() => {
          alert("تم تسجيل الدخول بنجاح");
          document.getElementById("admin-section").style.display = "block";
        })
        .catch(err => alert("خطأ في الدخول: " + err.message));
    });

    document.getElementById("createBtn").addEventListener("click", async () => {
      const newUsername = document.getElementById("new-username").value;
      const newEmail = document.getElementById("new-email").value;
      const newPassword = document.getElementById("new-password").value;

      const docRef = db.collection("usernames").doc(newUsername);
      const existing = await docRef.get();
      if (existing.exists) return alert("اسم المستخدم مستخدم");

      auth.createUserWithEmailAndPassword(newEmail, newPassword)
        .then(async () => {
          await docRef.set({ email: newEmail });
          alert("تم إنشاء الحساب بنجاح");
        })
        .catch(err => alert("خطأ في الإنشاء: " + err.message));
    });
  </script>
</body>
</html>
